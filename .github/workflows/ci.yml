name: MergeMind CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Deterministic Linting & Formatting Check (Ruff)
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Static Security Scan (Bandit)
        run: |
          cd backend
          bandit -r app/ -ll -ii

      - name: Execute Automated Backend Test Suite (Pytest)
        run: |
          cd backend
          python -m pytest -v --cov=app --cov-report=term-missing

  frontend-checks:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check & Production Build
        run: |
          cd frontend
          npm run build

