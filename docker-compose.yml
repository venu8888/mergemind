services:
  # PostgreSQL 18 Persistence Database
  db:
    image: postgres:18-alpine
    container_name: mergemind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mergemind
    ports:
      - "5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mergemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mergemind-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/mergemind
      DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/mergemind
      ENVIRONMENT: development
      DEBUG: "true"
      SANDBOX_TYPE: container
      ENABLE_IN_PROCESS_WORKER: "true"
    ports:
      - "8000:8000"

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mergemind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres18_data:

